[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-assistant"
version = "1.0.0"
description = "Enterprise RAG assistant with source attribution, prompt-injection guardrails, and offline evaluation."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Alexandru Cojocari" }]
license = { text = "MIT" }
keywords = ["rag", "fastapi", "langchain", "chromadb", "faiss"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "langchain==1.4.7",
  "langchain-core==1.7.0",
  "langchain-text-splitters==1.1.3",
  "chromadb==1.5.9",
  "faiss-cpu==1.15.1",
  "numpy==2.5.4",
  "httpx==0.28.1",
  "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.urls]
Homepage = "https://github.com/DatadrivenAlex/enterprise-rag-assistant"
Repository = "https://github.com/DatadrivenAlex/enterprise-rag-assistant"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --tb=short"
